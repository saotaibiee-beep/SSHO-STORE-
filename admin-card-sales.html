<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0912"><link rel="icon" type="image/svg+xml" href="/assets/ssho-store-logo.svg?v=brand20261102"><link rel="apple-touch-icon" href="/assets/ssho-store-logo.svg?v=brand20261102"><title>إدارة بيع البطاقات | SSHO STORE"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0912;color:#f7f4fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px;max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:24px}p{color:#bbb4c9;line-height:1.7}.controls{display:flex;gap:8px;flex-wrap:wrap}select,input,button{font:inherit;border-radius:10px;padding:11px;background:#191523;color:#fff;border:1px solid #393247}button{cursor:pointer;background:#087cff;border:0;font-weight:700}button.secondary{background:#2a2535}button.danger{background:#a62b48}.list{display:grid;gap:14px;margin-top:18px}.card{border:1px solid #332d40;border-radius:16px;padding:16px;background:#13101b;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.field{background:#1b1725;border-radius:10px;padding:10px}.field small{display:block;color:#aaa1b9;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.reason{width:100%;margin-top:10px}.status{color:#7ee0b5}.err{color:#ff8da4;white-space:pre-wrap}@media(max-width:560px){body{padding:13px}h1{font-size:20px}}
</style></head><body><header class="top"><div style="display:flex;align-items:center;gap:12px"><img src="/assets/ssho-store-logo.svg?v=brand20261102" alt="SSHO STORE" width="68" height="68" style="width:68px;height:68px;object-fit:contain;flex:0 0 68px"><div><h1>طلبات بيع البطاقات الرقمية</h1><p>مراجعة يدوية فقط — لا يتم تنفيذ أي تحويل مالي من هذه اللوحة.</p></div></div><div class="controls"><select id="filter"><option value="pending_review">قيد المراجعة</option><option value="completed">مكتملة / تم التحويل</option><option value="rejected">مرفوضة</option><option value="all">كل الطلبات</option></select><button onclick="load()">تحديث</button></div></header><div id="message" role="status"></div><main id="list" class="list"><p>جارٍ التحقق من صلاحية الإدارة وتحميل الطلبات…</p></main><script>
(function(){try{const t=window.Telegram?.WebApp;if(t){t.ready();t.expand()}}catch(e){}})();
const $=id=>document.getElementById(id);\nwindow.addEventListener("error",e=>{const m=$("message");if(m)m.innerHTML="<p class=\\"err\\">تعذر تشغيل لوحة الإدارة: "+String(e.message||"خطأ JavaScript").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</p>";});\nwindow.addEventListener("unhandledrejection",e=>{const m=$("message");if(m)m.textContent="تعذر إكمال العملية: "+String(e.reason?.message||e.reason||"خطأ غير معروف");});
async function api(method,body){const initData=window.Telegram?.WebApp?.initData||"";if(!initData)throw new Error("افتح لوحة الإدارة من زر الإدارة داخل البوت، وليس كرابط خارجي.");const r=await fetch("/api/card-sell-requests"+(method==="GET"?"?status="+encodeURIComponent($("filter").value):""),{method,cache:"no-store",headers:{"Content-Type":"application/json","Authorization":"tma "+initData},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"تعذر تنفيذ الطلب");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function review(id,status){let reason="";if(status==="rejected"){reason=prompt("سبب الرفض (إلزامي):","الكود غير صالح")||"";if(!reason.trim())return}if(status==="completed"&&!confirm("هل تحققت يدوياً من البطاقة وقمت بتحويل USDT فعلياً إلى العميل؟ لن ينفذ النظام أي تحويل."))return;try{const d=await api("PATCH",{id,status,rejection_reason:reason});$("message").innerHTML='<p class="status">'+esc(d.message)+'</p>';await load()}catch(e){$("message").innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function load(){ $("list").innerHTML="<p>جارٍ التحميل…</p>";$("message").textContent="";try{const d=await api("GET");if(!d.requests?.length){$("list").innerHTML="<p>لا توجد طلبات في هذا التصنيف.</p>";return}$("list").innerHTML=d.requests.map(x=>'<article class="card"><div class="top"><strong>'+esc(x.card_type)+' — '+esc(x.face_value)+' '+esc(x.currency)+'</strong><span>'+esc(({pending_review:"قيد المراجعة",completed:"مكتمل / تم التحويل",rejected:"مرفوض"}[x.status]||x.status))+'</span></div><div class="grid"><div class="field"><small>رقم الطلب</small>'+esc(x.id)+'</div><div class="field"><small>معرّف تيليجرام</small>'+esc(x.telegram_id)+'</div><div class="field"><small>اسم العميل</small>'+esc(x.customer_name||"—")+'</div><div class="field"><small>كود البطاقة (سري)</small>'+esc(x.card_code)+'</div><div class="field"><small>عنوان محفظة USDT</small>'+esc(x.usdt_wallet_address)+'</div><div class="field"><small>وقت الإرسال</small>'+esc(new Date(x.created_at).toLocaleString())+'</div></div>'+(x.rejection_reason?'<p>سبب الرفض: '+esc(x.rejection_reason)+'</p>':"")+(x.status==="pending_review"?'<div class="actions"><button onclick="review(\''+esc(x.id)+'\',\'completed\')">موافقة / تم التحويل</button><button class="danger" onclick="review(\''+esc(x.id)+'\',\'rejected\')">رفض / كود غير صالح</button></div>':"")+'</article>').join("")}catch(e){$("list").innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
$("filter").addEventListener("change",load);\nif(document.readyState==="loading")document.addEventListener("DOMContentLoaded",load,{once:true});else load();
</script></body></html>
