<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة بطاقات Binance Gift Card — SSHO STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0912;--card:#151220;--line:#30283f;--text:#f5f0ff;--muted:#a79ab9;--blue:#168dff;--green:#54d6a0;--red:#ff727f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17172a,var(--bg) 55%);color:var(--text);font-family:Tajawal,sans-serif;padding:20px;max-width:900px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:24px;margin:0}p{color:var(--muted)}button,select,textarea{font:inherit}button,select{border:1px solid var(--line);border-radius:12px;background:#211b30;color:var(--text);padding:10px 14px;cursor:pointer}button.primary{background:linear-gradient(110deg,#168dff,#7d4dff);border:0;font-weight:800}button:disabled{opacity:.5}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}.list{display:grid;gap:12px}.card{border:1px solid var(--line);background:rgba(21,18,32,.95);border-radius:18px;padding:16px;box-shadow:0 8px 30px #0002}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.code{direction:ltr;text-align:left;overflow-wrap:anywhere;background:#090811;border:1px dashed #4e4265;padding:12px;border-radius:10px;font:600 15px monospace;user-select:text;margin:12px 0}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.meta>div{background:#0e0c17;border-radius:10px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.approve{border-color:#2a8061;color:var(--green)}.reject{border-color:#7b3543;color:var(--red)}textarea{width:100%;background:#0e0c17;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:60px;margin-top:10px}.empty,.error{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.error{color:var(--red)}.badge{padding:4px 9px;border-radius:20px;background:#302542;font-size:12px}.hidden{display:none!important}
</style></head>
<body>
<header><div><h1>طلبات Binance Gift Card</h1><p>طلبات أكواد البطاقات المرسلة من العملاء</p></div><button class="primary" onclick="loadItems()">تحديث الطلبات ↻</button></header>
<div id="status" class="empty">جارٍ التحقق من صلاحيات الإدارة…</div>
<div id="app" class="hidden"><div class="filters"><select id="filter" onchange="loadItems()"><option value="pending_review">قيد المراجعة</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option></select></div><div id="list" class="list"></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const initData=tg?.initData||"";
const statusEl=document.getElementById("status"),app=document.getElementById("app"),list=document.getElementById("list");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","Authorization":"tma "+initData,...(opts.headers||{})},cache:"no-store"});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"تعذر الاتصال بالخادم");return d}
async function loadItems(){if(!initData){statusEl.className="error";statusEl.textContent="افتح هذه الصفحة من داخل Telegram Web App لتأكيد هويتك.";return}statusEl.className="empty";statusEl.textContent="جارٍ تحميل الطلبات…";try{const d=await api("/api/admin/gift-card-submissions?status="+encodeURIComponent(document.getElementById("filter").value));app.classList.remove("hidden");statusEl.classList.add("hidden");if(!d.submissions?.length){list.innerHTML='<div class="empty">لا توجد طلبات في هذا القسم حالياً.</div>';return}list.innerHTML=d.submissions.map(x=>'<article class="card"><div class="row"><strong>طلب شحن #'+esc(x.deposit_id)+'</strong><span class="badge">'+esc(x.status)+'</span></div><div class="meta"><div><div class="muted">العميل</div><b>'+esc(x.customer_name||"بدون اسم")+'</b><div class="muted">'+(x.customer_username?"@"+esc(x.customer_username):"")+'</div></div><div><div class="muted">معرّف تيليجرام</div><b>'+esc(x.telegram_user_id)+'</b></div><div><div class="muted">المبلغ المطلوب</div><b>'+esc(x.amount)+' USDT</b></div><div><div class="muted">تاريخ الطلب</div><b>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</b></div></div><div class="muted" style="margin-top:12px">كود البطاقة</div><div class="code" id="code-'+esc(x.id)+'">'+esc(x.card_code)+'</div><div class="actions"><button onclick="copyCode('+Number(x.id)+')">نسخ الكود</button><button class="approve" onclick="updateItem('+Number(x.id)+',\'approved\')">وضع كمقبول</button><button class="reject" onclick="updateItem('+Number(x.id)+',\'rejected\')">رفض الطلب</button></div><textarea id="note-'+esc(x.id)+'" placeholder="ملاحظة إدارية (اختياري)">'+esc(x.admin_note||"")+'</textarea></article>').join("")}catch(e){statusEl.className="error";statusEl.textContent=e.message;app.classList.add("hidden")}}
async function updateItem(id,status){try{await api("/api/admin/gift-card-submissions",{method:"PATCH",body:JSON.stringify({id,status,adminNote:document.getElementById("note-"+id)?.value||""})});await loadItems()}catch(e){alert(e.message)}}
async function copyCode(id){const value=document.getElementById("code-"+id)?.textContent||"";try{await navigator.clipboard.writeText(value);alert("تم نسخ الكود")}catch{alert(value)}}
loadItems();
</script></body></html>
