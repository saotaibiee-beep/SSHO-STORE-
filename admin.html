<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0912">
<title>لوحة الإدارة | SSHO STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0912;--panel:#151220;--line:#30283f;--text:#f5f0ff;--muted:#a79ab9;--blue:#168dff;--green:#54d6a0;--red:#ff727f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17172a,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 13px calc(22px + env(safe-area-inset-bottom));max-width:1000px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:8px 0}p{color:var(--muted);line-height:1.7;font-size:13px}button,select,textarea{font:inherit}button,select{border:1px solid var(--line);border-radius:12px;background:#211b30;color:var(--text);padding:10px 12px;cursor:pointer}button.primary{background:linear-gradient(110deg,#168dff,#7d4dff);border:0;font-weight:800}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.tab{padding:13px 7px;font-size:12px}.tab.active{background:#342346;border-color:#9b68ed;color:#fff;box-shadow:0 0 0 1px #9b68ed22}.panel{display:none}.panel.active{display:block}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.list{display:grid;gap:12px}.card{border:1px solid var(--line);background:rgba(21,18,32,.95);border-radius:16px;padding:14px;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:var(--muted);font-size:12px}.code{direction:ltr;text-align:left;overflow-wrap:anywhere;background:#090811;border:1px dashed #4e4265;padding:11px;border-radius:10px;font:600 14px monospace;user-select:text;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:12px}.field{background:#0e0c17;border-radius:10px;padding:10px;font-size:12px;overflow-wrap:anywhere}.field small{display:block;color:#aaa1b9;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.approve{border-color:#2a8061;color:var(--green)}.reject{border-color:#7b3543;color:var(--red)}textarea{width:100%;background:#0e0c17;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:58px;margin-top:10px}.empty,.error{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.error{color:var(--red);white-space:pre-wrap}.ok{color:var(--green)}.hidden{display:none!important}.status{font-size:12px;margin:10px 0}@media(min-width:700px){body{padding:24px}.tabs{max-width:620px}}
</style></head>
<body>
<header><div><h1>لوحة الإدارة</h1><p>SSHO STORE — مراجعة طلبات الشحن وبيع البطاقات الرقمية</p></div><button class="primary" id="refreshBtn">تحديث القسم</button></header>
<div id="status" class="empty">جارٍ التحقق من صلاحيات الإدارة عبر تيليجرام…</div>
<nav class="tabs hidden" id="tabs" aria-label="أقسام الإدارة"><button class="tab active" data-panel="gift">طلبات شحن Binance Gift Cards</button><button class="tab" data-panel="sell">طلبات بيع البطاقات الرقمية</button></nav>
<section id="panel-gift" class="panel"><div class="row"><h2>مراجعة طلبات الشحن</h2><select id="giftFilter" aria-label="تصفية طلبات الشحن"><option value="pending_review">قيد المراجعة</option><option value="approved">مقبولة</option><option value="rejected">مرفوضة</option></select></div><div id="giftList" class="list"><div class="empty">جارٍ التحميل…</div></div></section>
<section id="panel-sell" class="panel"><div class="row"><h2>مراجعة طلبات بيع البطاقات</h2><select id="sellFilter" aria-label="تصفية طلبات البيع"><option value="pending_review">قيد المراجعة</option><option value="completed">مكتملة / تم التحويل</option><option value="rejected">مرفوضة</option><option value="all">كل الطلبات</option></select></div><div id="sellList" class="list"><div class="empty">جارٍ التحميل…</div></div></section>
<script>
(function(){try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){if(typeof tg.ready==="function")tg.ready();if(typeof tg.expand==="function")tg.expand();try{tg.setHeaderColor("#0b0912");tg.setBackgroundColor("#0b0912")}catch(_){}}}catch(_){}})();
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function initData(){return window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData||""}
async function api(url,method="GET",body){const data=initData();if(!data)throw new Error("افتح لوحة الإدارة من زر «لوحة الإدارة» داخل بوت تيليجرام، وليس من متصفح خارجي.");const r=await fetch(url+(url.includes("?")?"&":"?")+"_ts="+Date.now(),{method,cache:"no-store",headers:{"Authorization":"tma "+data,"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("فشل الطلب ("+r.status+")"));return d}
function setStatus(msg,error=false){$("status").className=error?"error":"status";$("status").textContent=msg}
function showPanel(name){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.panel===name));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+name));$("refreshBtn").dataset.panel=name;loadPanel(name)}
async function loadPanel(name){if(name==="gift")return loadGift();if(name==="sell")return loadSell()}
async function loadGift(){const box=$("giftList");box.innerHTML='<div class="empty">جارٍ تحميل طلبات الشحن…</div>';try{const d=await api("/api/admin/gift-card-submissions?status="+encodeURIComponent($("giftFilter").value));const rows=d.submissions||[];if(!rows.length){box.innerHTML='<div class="empty">لا توجد طلبات في هذا التصنيف.</div>';return}box.innerHTML=rows.map(x=>'<article class="card"><div class="row"><strong>طلب شحن #'+esc(x.deposit_id)+'</strong><span>'+esc(({pending_review:"قيد المراجعة",approved:"مقبول",rejected:"مرفوض"}[x.status]||x.status))+'</span></div><div class="grid"><div class="field"><small>العميل</small>'+esc(x.customer_name||"بدون اسم")+'<br><span class="muted">'+(x.customer_username?"@"+esc(x.customer_username):"")+'</span></div><div class="field"><small>معرّف تيليجرام</small>'+esc(x.telegram_user_id)+'</div><div class="field"><small>القيمة</small>'+esc(x.amount)+' USDT</div><div class="field"><small>وقت الطلب</small>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</div></div><div class="muted" style="margin-top:12px">كود البطاقة</div><div class="code" id="gift-code-'+Number(x.id)+'">'+esc(x.card_code)+'</div><button type="button" onclick="copyText('gift-code-'+Number(x.id)+'')">نسخ الكود</button>'+(x.status==="pending_review"?'<textarea id="gift-note-'+Number(x.id)+'" placeholder="ملاحظة إدارية (اختياري)">'+esc(x.admin_note||"")+'</textarea><div class="actions"><button class="approve" onclick="reviewGift('+Number(x.id)+','approved')">اعتماد الطلب</button><button class="reject" onclick="reviewGift('+Number(x.id)+','rejected')">رفض الطلب</button></div>':(x.admin_note?'<p>الملاحظة: '+esc(x.admin_note)+'</p>':""))+'</article>').join("")}catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function reviewGift(id,status){const note=$("gift-note-"+id)?.value||"";if(!confirm(status==="approved"?"تأكيد اعتماد بطاقة Binance وإضافة الرصيد للعميل؟":"تأكيد رفض طلب الشحن؟"))return;try{const d=await api("/api/admin/gift-card-submissions","PATCH",{id,status,adminNote:note});setStatus(d.message||"تم حفظ المراجعة.");await loadGift()}catch(e){setStatus(e.message,true)}}
async function loadSell(){const box=$("sellList");box.innerHTML='<div class="empty">جارٍ تحميل طلبات بيع البطاقات…</div>';try{const d=await api("/api/card-sell-requests?status="+encodeURIComponent($("sellFilter").value));const rows=d.requests||[];if(!rows.length){box.innerHTML='<div class="empty">لا توجد طلبات في هذا التصنيف.</div>';return}box.innerHTML=rows.map(x=>'<article class="card"><div class="row"><strong>'+esc(x.card_type)+' — '+esc(x.face_value)+' '+esc(x.currency)+'</strong><span>'+esc(({pending_review:"قيد المراجعة",completed:"مكتمل / تم التحويل",rejected:"مرفوض"}[x.status]||x.status))+'</span></div><div class="grid"><div class="field"><small>رقم الطلب</small>'+esc(x.id)+'</div><div class="field"><small>معرّف تيليجرام</small>'+esc(x.telegram_id)+'</div><div class="field"><small>اسم العميل</small>'+esc(x.customer_name||"—")+'</div><div class="field"><small>وقت الإرسال</small>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</div></div><div class="field" style="margin-top:8px"><small>كود البطاقة (سري)</small><div class="code" id="sell-code-'+esc(x.id)+'">'+esc(x.card_code)+'</div><button type="button" onclick="copyText('sell-code-'+esc(x.id)+'')">نسخ الكود</button></div><div class="field" style="margin-top:8px"><small>عنوان محفظة USDT</small><div dir="ltr">'+esc(x.usdt_wallet_address)+'</div><button type="button" onclick="copyValue(''+esc(x.usdt_wallet_address)+'')">نسخ العنوان</button></div>'+(x.rejection_reason?'<p>سبب الرفض: '+esc(x.rejection_reason)+'</p>':"")+(x.status==="pending_review"?'<div class="actions"><button class="approve" onclick="reviewSell(''+esc(x.id)+'','completed')">اعتماد بعد التحقق والتحويل</button><button class="reject" onclick="reviewSell(''+esc(x.id)+'','rejected')">رفض الطلب</button></div>':"")+'</article>').join("")}catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function reviewSell(id,status){let reason="";if(status==="rejected"){reason=prompt("سبب الرفض (إلزامي):","الكود غير صالح")||"";if(!reason.trim())return}else if(!confirm("هل تحققت يدوياً من البطاقة وأرسلت USDT فعلياً إلى العميل؟ النظام لا ينفذ التحويل."))return;try{const d=await api("/api/card-sell-requests","PATCH",{id,status,rejection_reason:reason});setStatus(d.message||"تم حفظ القرار.");await loadSell()}catch(e){setStatus(e.message,true)}}
async function copyText(id){const el=$(id);if(el)copyValue(el.textContent||"")}
async function copyValue(v){try{await navigator.clipboard.writeText(v);setStatus("تم النسخ.")}catch(_){setStatus("تعذر النسخ التلقائي؛ اضغط مطولاً على النص لنسخه.",true)}}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>showPanel(b.dataset.panel)));
$("giftFilter").addEventListener("change",loadGift);$("sellFilter").addEventListener("change",loadSell);$("refreshBtn").addEventListener("click",()=>loadPanel($("refreshBtn").dataset.panel||"gift"));
window.addEventListener("error",e=>setStatus("خطأ JavaScript: "+(e.message||"غير معروف"),true));window.addEventListener("unhandledrejection",e=>setStatus("خطأ: "+String(e.reason?.message||e.reason||"غير معروف"),true));
(async function boot(){const t=window.Telegram?.WebApp;if(!initData()){setStatus("جلسة تيليجرام غير متاحة. افتح المتجر من داخل البوت ثم اختر لوحة الإدارة.",true);return}try{await api("/api/admin/gift-card-submissions?status=pending_review");$("tabs").classList.remove("hidden");$("status").className="status ok";$("status").textContent="تم التحقق من صلاحية الإدارة.";showPanel("gift")}catch(e){setStatus(e.message,true)}})();
</script></body></html>
