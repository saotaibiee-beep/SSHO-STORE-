<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b101d"><title>الإدارة | SSHO STORE</title><style>
:root{font-family:system-ui,Tahoma,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b101d;color:#f1f4fb}.wrap{max-width:1050px;margin:auto;padding:20px}header{border-bottom:1px solid #303a4b;background:#111a29}header .wrap{display:flex;justify-content:space-between;align-items:center}a{color:#baa7ff;text-decoration:none}.panel{background:#172235;border:1px solid #354057;border-radius:18px;padding:20px;margin:18px 0}h1{font-size:24px}h2{font-size:20px}button,input,textarea,select{font:inherit;color:white;background:#101a29;border:1px solid #46536a;border-radius:11px;padding:12px}input,textarea,select{width:100%;margin:6px 0 13px}textarea{min-height:95px}button{cursor:pointer}button.primary{background:#8970e6;border:0;color:#080b14;font-weight:800}button:disabled{opacity:.5}.muted{color:#aeb9cb}.tabs{display:flex;flex-wrap:wrap;gap:10px}.tab.active{background:#59459e}.cards{display:grid;gap:12px}.item{padding:15px;border:1px solid #38475b;border-radius:13px;background:#111a2b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.error{color:#ff9baa}.ok{color:#80dfb8}small{color:#aeb9cb}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><header><div class="wrap"><strong>SSHO STORE — الإدارة</strong><a href="/">العودة للمتجر</a></div></header><main class="wrap"><div id="login" class="panel"><h1>دخول الإدارة</h1><p class="muted">الدخول متاح للحسابات المعتمدة فقط.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="primary" id="loginBtn">دخول</button><p id="loginStatus"></p></div><div id="dashboard" class="hidden"><div class="row"><h1>لوحة الإدارة</h1><button id="logout">تسجيل الخروج</button></div><div class="tabs"><button class="tab active" data-tab="orders">الطلبات</button><button class="tab" data-tab="products">المنتجات</button><button class="tab" data-tab="support">الدعم</button></div><section id="orders" class="panel"><h2>الطلبات</h2><div id="ordersList" class="cards"></div></section><section id="products" class="panel hidden"><h2>إدارة المنتجات</h2><form id="productForm"><input type="hidden" id="pid"><div class="grid"><label>اسم المنتج<input id="pname" required></label><label>السعر بالدولار<input id="pprice" type="number" min=".01" step=".01" required></label><label>التصنيف<input id="pcategory"></label><label>صورة المنتج من الجهاز<input id="pfile" type="file" accept="image/png,image/jpeg,image/webp"><small id="uploadStatus">يمكنك رفع الصورة مباشرة</small><input id="pimage" type="url" placeholder="رابط الصورة (اختياري)"></label><label>المخزون<input id="pstock" type="number" min="0" value="10"></label><label>المعرّف المختصر<input id="pslug"></label></div><label>الوصف<textarea id="pdescription"></textarea></label><label>الملاحظات<textarea id="pnotes"></textarea></label><label>طريقة الاستخدام<textarea id="pusage"></textarea></label><label><input id="pactive" type="checkbox" checked style="width:auto"> منشور</label><label><input id="pavailable" type="checkbox" checked style="width:auto"> متاح</label><div class="row"><button class="primary" type="submit">حفظ المنتج</button><button type="button" id="reset">منتج جديد</button></div><p id="productStatus"></p></form><hr style="border-color:#344155"><div id="productsList" class="cards"></div></section><section id="support" class="panel hidden"><h2>طلبات الدعم</h2><div id="supportList" class="cards"></div></section></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.95.3';
const db=createClient('https://dhhadlomsualjzirfjxe.supabase.co','sb_publishable_3cZUlEyzsjwppxHwEuQXOw_HyeFakzs');
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentProducts=[];
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}const {data:role,error}=await db.from('store_admins').select('role,active').eq('user_id',user.id).maybeSingle();if(error||!role?.active){$('loginStatus').textContent='الحساب غير مخوّل لإدارة المتجر';await db.auth.signOut();return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await Promise.all([orders(),products(),support()])}
$('loginBtn').onclick=async()=>{$('loginStatus').textContent='جاري تسجيل الدخول...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginStatus').textContent=error.message;return}await check()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));['orders','products','support'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});
async function orders(){const {data,error}=await db.from('orders').select('id,order_number,product_name,unit_price,status,checkout_method,guest_email,created_at').order('created_at',{ascending:false}).limit(100);$('ordersList').innerHTML=error?'<p class="error">'+esc(error.message)+'</p>':(data?.length?data.map(o=>'<div class="item"><div class="row"><strong>'+esc(o.order_number)+'</strong><small>'+new Date(o.created_at).toLocaleString('ar-SA')+'</small></div><p>'+esc(o.product_name)+' — $'+Number(o.unit_price).toFixed(2)+'</p><p class="muted">'+esc(o.guest_email||'حساب مسجل')+' · '+esc(o.checkout_method||'قديم')+'</p><label>الحالة<select data-order="'+esc(o.id)+'">'+['awaiting_payment','paid','completed','cancelled','refunded'].map(s=>'<option value="'+s+'" '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div>').join(''):'<p class="muted">لا توجد طلبات</p>');$('ordersList').querySelectorAll('select').forEach(s=>s.onchange=async()=>{if(s.value==='paid'){alert('يجب اعتماد الدفع من تحقق PayPal، وليس تغيير الحالة يدويًا');await orders();return}const {error}=await db.from('orders').update({status:s.value}).eq('id',s.dataset.order);if(error)alert(error.message);await orders()})}
async function products(){const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});currentProducts=data||[];$('productsList').innerHTML=error?'<p class="error">'+esc(error.message)+'</p>':currentProducts.map(p=>'<div class="item row"><div><strong>'+esc(p.name)+'</strong><p class="muted">$'+Number(p.price).toFixed(2)+' · '+(p.active?'منشور':'مخفي')+'</p></div><button data-edit="'+esc(p.id)+'">تعديل</button></div>').join('');$('productsList').querySelectorAll('button').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function edit(id){const p=currentProducts.find(x=>x.id===id);if(!p)return;for(const [field,val] of Object.entries({pid:p.id,pname:p.name,pprice:p.price,pcategory:p.category,pimage:p.image_url,pstock:p.stock_count,pslug:p.slug,pdescription:p.description,pnotes:p.important_notes,pusage:p.how_to_use}))$(field).value=val??'';$('pactive').checked=!!p.active;$('pavailable').checked=!!p.available;$('productForm').scrollIntoView({behavior:'smooth'})}
$('pfile').onchange=async()=>{const file=$('pfile').files?.[0];if(!file)return;if(file.size>5*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){$('uploadStatus').textContent='الصورة يجب أن تكون PNG أو JPG أو WebP وبحجم أقل من 5MB';return}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path='catalog/'+crypto.randomUUID()+'.'+ext;$('uploadStatus').textContent='جاري رفع الصورة...';const {error}=await db.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(error){$('uploadStatus').textContent='تعذر الرفع: '+error.message;return}const {data}=db.storage.from('product-images').getPublicUrl(path);$('pimage').value=data.publicUrl;$('uploadStatus').textContent='تم رفع الصورة بنجاح. احفظ المنتج لتحديث البطاقة.'};
$('reset').onclick=()=>{$('productForm').reset();$('pid').value='';$('productStatus').textContent=''};
$('productForm').onsubmit=async e=>{e.preventDefault();const id=$('pid').value;const payload={name:$('pname').value.trim(),price:Number($('pprice').value),category:$('pcategory').value.trim(),image_url:$('pimage').value.trim()||null,stock_count:Number($('pstock').value),slug:$('pslug').value.trim()||$('pname').value.trim().toLowerCase().replace(/\s+/g,'-'),description:$('pdescription').value,important_notes:$('pnotes').value,how_to_use:$('pusage').value,active:$('pactive').checked,available:$('pavailable').checked,currency:'USD'};const result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);$('productStatus').textContent=result.error?result.error.message:'تم حفظ المنتج';$('productStatus').className=result.error?'error':'ok';if(!result.error)await products()};
async function support(){const {data,error}=await db.from('support_requests').select('*').order('created_at',{ascending:false}).limit(50);$('supportList').innerHTML=error?'<p class="error">'+esc(error.message)+'</p>':(data?.length?data.map(s=>'<div class="item"><strong>'+esc(s.subject||'طلب دعم')+'</strong><p>'+esc(s.details||s.message||'')+'</p><small>'+esc(s.customer_email||'')+'</small></div>').join(''):'<p class="muted">لا توجد طلبات دعم</p>')}
await check();
</script></body></html>
